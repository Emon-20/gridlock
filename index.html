<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridLock — Claim Your Territory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">GRID<span>LOCK</span></h1>
            <p class="tagline">Claim Your Territory</p>
        </header>

        <!-- Mode Selector -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="pvp">👥 vs Player</button>
            <button class="mode-btn" data-mode="pvc">🤖 vs Computer</button>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="player-card player-1-card active">
                <div class="player-dot"></div>
                <div class="player-info">
                    <span class="player-label">Player 1</span>
                    <span class="player-score" id="score1">0</span>
                </div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="player-card player-2-card">
                <div class="player-dot"></div>
                <div class="player-info">
                    <span class="player-label" id="p2Label">Player 2</span>
                    <span class="player-score" id="score2">0</span>
                </div>
            </div>
        </div>

        <!-- Timer -->
        <div class="timer-wrapper">
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill"></div>
            </div>
            <span class="timer-text" id="timerText">15s</span>
        </div>

        <!-- Turn Indicator -->
        <div class="turn-indicator p1" id="turnIndicator">
            <span class="turn-dot p1"></span>
            Player 1's Turn
        </div>

        <!-- Game Board -->
        <div class="board-wrapper">
            <div class="board" id="board" data-current-player="1"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn undo-btn" id="undoBtn" disabled>↩ Undo</button>
            <button class="btn restart-btn" id="restartBtn">↻ Restart</button>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Draw lines between dots · Complete boxes to score · Beat your opponent!</p>
        </footer>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-icon" id="modalIcon">🏆</div>
            <h2 class="modal-title" id="modalTitle">Player 1 Wins!</h2>
            <p class="modal-subtitle" id="modalSubtitle">Dominated the grid!</p>
            <div class="modal-scores">
                <div class="modal-score p1-ms">
                    <span class="ms-label">Player 1</span>
                    <span class="ms-value" id="modalScore1">0</span>
                </div>
                <span class="modal-vs">—</span>
                <div class="modal-score p2-ms">
                    <span class="ms-label" id="modalP2Label">Player 2</span>
                    <span class="ms-value" id="modalScore2">0</span>
                </div>
            </div>
            <button class="btn play-again-btn" id="playAgainBtn">🔄 Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
